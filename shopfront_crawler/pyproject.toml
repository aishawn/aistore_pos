[project]
name = "shopfront-crawler"
version = "0.1.0"
description = "Shopfront OAuth and synchronization service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "APScheduler>=3.10,<4",
  "cryptography>=43,<46",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
