# Frontend-only compose. Full stack (recommended): use repo root docker-compose.yml + root .env
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    image: orithos-frontend:latest
    container_name: orithos-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}
      POS_REDIS_URL: ${POS_REDIS_URL:?Set POS_REDIS_URL}
      AI_FORECAST_BASE_URL: ${AI_FORECAST_BASE_URL:-https://ai.orithos.com.au}
      AI_FORECAST_READ_TIMEOUT_MS: ${AI_FORECAST_READ_TIMEOUT_MS:-190000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
    env_file:
      - path: .env
        required: false
