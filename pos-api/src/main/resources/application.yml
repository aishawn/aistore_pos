# HTTP 服务
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pos-api
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  # 本地 IDE：复制 pos-api/.env.example → .env，启动时自动加载
  # Docker：由 compose 注入 DB_HOST=mysql、REDIS_HOST=redis 等环境变量
  config:
    import: optional:file:.env[.properties]
  # DashScope starter 会无条件注册全部 AI Bean；默认排除，仅在 app.ai.enabled=true 时由 PosAssistantGraphConfig 按需导入
  autoconfigure:
    exclude:
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAgentAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeImageAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeVideoAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioSpeechAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAudioTranscriptionAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeRerankAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeEmbeddingAutoConfiguration
      - com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeAsyncToolCallingManagerAutoConfiguration
  # MySQL 数据源
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orithos}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis（JWT 黑名单、刷新令牌、报表缓存等）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:orithos-redis}"
      database: 0
  # Optional SMTP for invite / password-reset emails (leave MAIL_HOST empty to disable)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # 首次启动可设为 always 执行 schema.sql；之后建议设为 never
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
  # 阿里云百炼 DashScope（Spring AI 模型）
  # AI_DASHSCOPE_BASE_URL = host only（https://dashscope.aliyuncs.com）。不要加 /api/v1 或 /compatible-mode/v1。
  # 国际区 Key：https://dashscope-intl.aliyuncs.com
  # qwen3.8-flash 等模型需按请求走 multimodal-generation（multi-model=true）；
  # DashScopeEnvironmentPostProcessor 设置模型默认标志，分类器也按其覆盖模型设置请求标志。
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          # qwen-plus / qwen-flash = text-generation；qwen3.8-flash uses multi-model=true
          # completions-path stays text as fallback; multi-model requests force multimodal-generation
          # (override with AI_DASHSCOPE_MULTI_MODEL / AI_DASHSCOPE_COMPLETIONS_PATH if needed)
          model: ${AI_DASHSCOPE_MODEL:qwen-plus}
          temperature: ${AI_DASHSCOPE_TEMPERATURE:0.1}
          max-tokens: ${AI_DASHSCOPE_MAX_TOKENS:1024}
      audio:
        transcription:
          options:
            model: ${AI_TRANSCRIPTION_MODEL:qwen3-asr-flash}

# MyBatis 映射与命名转换
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.orithos
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  # Public browser origin used in invite / password-reset links
  public-url: ${PUBLIC_APP_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@orithos.com.au}
  jwt:
    # 生产环境务必修改；HS256 要求密钥长度 >= 32 字节
    secret: ${JWT_SECRET:shopfront-dev-secret-key-change-me-please-0123456789}
    access-token-ttl-minutes: 120   # 访问令牌有效期（分钟）
    refresh-token-ttl-days: 14      # 刷新令牌有效期（天）
    issuer: shopfront
  cors:
    # 允许调用本 API 的前端来源，逗号分隔；支持通配 https://*.orithos.com.au
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://*.localhost:3000}
  tenant:
    base-domain: ${APP_TENANT_BASE_DOMAIN:orithos.com.au}
    reserved-slugs: ${APP_TENANT_RESERVED_SLUGS:www,app,api,odoo,cdn,support,mail,status}
    trial-days: ${APP_TRIAL_DAYS:14}
    # Local: http — production should be https
    scheme: ${APP_TENANT_SCHEME:https}
    # Admins of this store can list/create tenants on app.* (control plane)
    platform-operator-slug: ${APP_PLATFORM_OPERATOR_SLUG:demo}
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:123456}
  ai:
    # 设为 true 并配置 AI_DASHSCOPE_API_KEY 后启用 Graph 智能助手 + 语音转写 + 酒标识别
    enabled: ${AI_ENABLED:false}
    graph-name: pos-assistant       # Graph 工作流名称
    transcription-model: ${AI_TRANSCRIPTION_MODEL:qwen3-asr-flash}
    # Use the configured primary DashScope model when it supports native multimodal
    # requests; operators can still override this explicitly with AI_VISION_MODEL.
    vision-model: ${AI_VISION_MODEL:${AI_DASHSCOPE_MODEL:qwen3.8-flash}}
    # Faster classify-only model (default qwen-flash). Set empty to use chat model.
    classify-model: ${AI_DASHSCOPE_CLASSIFY_MODEL:qwen-flash}
    temperature: ${AI_DASHSCOPE_TEMPERATURE:0.1}
    max-tokens: ${AI_DASHSCOPE_MAX_TOKENS:1024}
    timeout-seconds: ${AI_DASHSCOPE_TIMEOUT_SECONDS:40}
    conversation-memory-turns: ${AI_CONVERSATION_MEMORY_TURNS:6}
    conversation-memory-ttl-minutes: ${AI_CONVERSATION_MEMORY_TTL_MINUTES:120}
    report:
      username: ${AI_REPORT_RO_USER:orithos_ai_ro}
      # Never use a source-controlled fallback for the tenant reporting account.
      password: ${AI_REPORT_RO_PASSWORD:}
      fallback-to-primary: false
      query-timeout-seconds: 5
      max-rows: 500
      queries-per-hour: ${AI_REPORT_QUOTA_QUERIES:120}
      tokens-per-hour: ${AI_REPORT_QUOTA_TOKENS:200000}

# 日志级别
logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
  level:
    com.orithos: INFO
