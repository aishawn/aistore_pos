# HTTP 服务
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: pos-api
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  # 本地 IDE：复制 pos-api/.env.example → .env，启动时自动加载
  # Docker：由 compose 注入 POSTGRESQL_URL 与 SPRING_DATA_REDIS_URL
  config:
    import: optional:file:.env[.properties]
  # The remote OpenAI-compatible model is imported only when the POS AI graph is enabled.
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
  # PostgreSQL 数据源。POSTGRESQL_URL 可使用 postgresql:// 或 jdbc:postgresql:// 格式。
  datasource:
    url: ${POSTGRESQL_JDBC_URL:jdbc:postgresql://localhost:5432/orithos}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  # Redis（JWT 黑名单、刷新令牌、报表缓存等）
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:${POS_REDIS_URL:redis://127.0.0.1:6379/0}}
      database: ${REDIS_DATABASE:0}
  # Optional SMTP for invite / password-reset emails (leave MAIL_HOST empty to disable)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  # 首次启动可设为 always 执行 PostgreSQL schema.sql；之后建议设为 never
  sql:
    init:
      mode: ${SQL_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
  # Remote AI Gateway (OpenAI-compatible)
  ai:
    openai:
      api-key: ${AI_SERVICE_TOKEN:}
      base-url: ${AI_SERVICE_BASE_URL:https://ai.orithos.com.au}/v1/provider
      chat:
        completions-path: /chat/completions
        options:
          model: ${AI_GATEWAY_PRIMARY_MODEL:qwen-plus}
          temperature: ${AI_TEMPERATURE:0.1}
          max-tokens: ${AI_MAX_TOKENS:1024}

# MyBatis 映射与命名转换
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.orithos
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  native-pos:
    enabled-vendor-ids: ${APP_NATIVE_POS_ENABLED_VENDOR_IDS:}
  shopfront:
    # Writes require the integration token and an enabled store mapping.
    integration-enabled: ${SHOPFRONT_INTEGRATION_ENABLED:false}
    integration-token: ${SHOPFRONT_INTEGRATION_TOKEN:}
    business-write-enabled: ${SHOPFRONT_BUSINESS_WRITE_ENABLED:${SHOPFRONT_INTEGRATION_ENABLED:false}}
  invoice:
    # Reserved for future supplier-provided invoice APIs. Keep false until an adapter exists.
    supplier-ingest-enabled: ${SUPPLIER_INVOICE_INGEST_ENABLED:false}
  # Public browser origin used in invite / password-reset links
  public-url: ${PUBLIC_APP_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@orithos.com.au}
  jwt:
    # 生产环境务必修改；HS256 要求密钥长度 >= 32 字节
    secret: ${JWT_SECRET:shopfront-dev-secret-key-change-me-please-0123456789}
    access-token-ttl-minutes: 120   # 访问令牌有效期（分钟）
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:365} # 开发阶段延长会话；可通过环境变量调整
    issuer: shopfront
  cors:
    # 允许调用本 API 的前端来源，逗号分隔；支持通配 https://*.orithos.com.au
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://*.localhost:3000}
  tenant:
    base-domain: ${APP_TENANT_BASE_DOMAIN:orithos.com.au}
    reserved-slugs: ${APP_TENANT_RESERVED_SLUGS:www,app,api,odoo,cdn,support,mail,status}
    trial-days: ${APP_TRIAL_DAYS:14}
    # Local: http — production should be https
    scheme: ${APP_TENANT_SCHEME:https}
    # Admins of this store can list/create tenants on app.* (control plane)
    platform-operator-slug: ${APP_PLATFORM_OPERATOR_SLUG:demo}
  initial-admin-password: ${INITIAL_ADMIN_PASSWORD:123456}
  ai:
    # Set true and configure AI_SERVICE_TOKEN to enable the remote AI features.
    enabled: ${AI_ENABLED:false}
    commands:
      enabled: ${AI_COMMANDS_ENABLED:true}
      # Preview can be enabled for manual testing; execution stays off until Odoo UAT,
      # tenant scoping and readback checks are complete.
      execution-enabled: ${AI_COMMANDS_EXECUTION_ENABLED:false}
    graph-name: pos-assistant       # Graph 工作流名称
    transcription-model: ${AI_GATEWAY_TRANSCRIPTION_MODEL:qwen3-asr-flash}
    vision-model: ${AI_GATEWAY_VISION_MODEL:qwen-vl-plus}
    classify-model: ${AI_GATEWAY_CLASSIFY_MODEL:qwen-flash}
    temperature: ${AI_TEMPERATURE:0.1}
    max-tokens: ${AI_MAX_TOKENS:1024}
    timeout-seconds: ${AI_GATEWAY_TIMEOUT_SECONDS:40}
    conversation-memory-turns: ${AI_CONVERSATION_MEMORY_TURNS:6}
    conversation-memory-ttl-minutes: ${AI_CONVERSATION_MEMORY_TTL_MINUTES:120}
    report:
      username: ${AI_REPORT_RO_USER:orithos_ai_ro}
      # Never use a source-controlled fallback for the tenant reporting account.
      password: ${AI_REPORT_RO_PASSWORD:}
      fallback-to-primary: false
      provision-all-on-startup: ${AI_REPORT_PROVISION_ALL_ON_STARTUP:false}
      query-timeout-seconds: 5
      max-rows: 500
      queries-per-hour: ${AI_REPORT_QUOTA_QUERIES:120}
      tokens-per-hour: ${AI_REPORT_QUOTA_TOKENS:200000}
    provider-quota:
      requests-per-hour: ${AI_PROVIDER_QUOTA_REQUESTS:120}
      tokens-per-hour: ${AI_PROVIDER_QUOTA_TOKENS:200000}
    gateway:
      provider: remote
      service-base-url: ${AI_SERVICE_BASE_URL:https://ai.orithos.com.au}
      service-token: ${AI_SERVICE_TOKEN:}
      # The provider adapter cannot bypass the product-wide AI switch.
      enabled: ${AI_GATEWAY_ENABLED:${AI_ENABLED:false}}
      max-input-chars: ${AI_GATEWAY_MAX_INPUT_CHARS:12000}
      max-retries: ${AI_GATEWAY_MAX_RETRIES:2}
      timeout-seconds: ${AI_GATEWAY_TIMEOUT_SECONDS:40}
      requests-per-minute: ${AI_GATEWAY_REQUESTS_PER_MINUTE:60}
      tokens-per-hour: ${AI_GATEWAY_TOKENS_PER_HOUR:200000}
      primary-model: ${AI_GATEWAY_PRIMARY_MODEL:qwen-plus}
      fallback-model: ${AI_GATEWAY_FALLBACK_MODEL:qwen-flash}
      transcription-model: ${AI_GATEWAY_TRANSCRIPTION_MODEL:qwen3-asr-flash}
      vision-model: ${AI_GATEWAY_VISION_MODEL:${AI_VISION_MODEL:qwen-vl-plus}}
      fallback-vision-model: ${AI_GATEWAY_FALLBACK_VISION_MODEL:qwen-vl-plus}
    snapshot:
      sync-enabled: ${APP_AI_SNAPSHOT_SYNC_ENABLED:false}
      sync-delay-ms: ${APP_AI_SNAPSHOT_SYNC_DELAY_MS:21600000}
      sync-initial-delay-ms: ${APP_AI_SNAPSHOT_SYNC_INITIAL_DELAY_MS:60000}
    forecast:
      enabled: ${AI_FORECAST_ENABLED:false}
      base-url: ${AI_FORECAST_BASE_URL:https://ai.orithos.com.au}
      service-token: ${AI_FORECAST_SERVICE_TOKEN:}
      read-timeout-ms: ${AI_FORECAST_READ_TIMEOUT_MS:190000}
      max-history-days: ${AI_FORECAST_MAX_HISTORY_DAYS:365}
      max-products: ${AI_FORECAST_MAX_PRODUCTS:2000}
    decision:
      replenishment:
        # Explicit policy inputs captured in each immutable snapshot.
        coverage-days: ${AI_REPLENISHMENT_COVERAGE_DAYS:7}
        service-factor: ${AI_REPLENISHMENT_SERVICE_FACTOR:1.65}
        case-pack: ${AI_REPLENISHMENT_CASE_PACK:1}

# 日志级别
logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
  level:
    com.orithos: INFO
