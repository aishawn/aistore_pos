# Self-contained stack for the Orithos backend: API + PostgreSQL + Redis 7.
# Run from pos-api/:  docker compose up --build
#
# PostgreSQL is supplied through POSTGRESQL_URL; schema initialization is handled
# by Spring when SQL_INIT_MODE is explicitly enabled for a fresh database.
services:
  redis:
    image: redis:7-alpine
    container_name: orithos-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-orithos-redis}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-orithos-redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: orithos-backend:latest
    container_name: orithos-backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      POSTGRESQL_URL: ${POSTGRESQL_URL:?Set POSTGRESQL_URL}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-orithos-redis}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-plus-production-secret-0123456789}
      # Set SQL_INIT_MODE=always only for a fresh database.
      SQL_INIT_MODE: never
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # AI assistant (DashScope). Defaults off; set AI_ENABLED=true + key in .env
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL:-qwen-plus}
      AI_DASHSCOPE_BASE_URL: ${AI_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-qwen3-asr-flash}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
      AI_REPORT_RO_USER: ${AI_REPORT_RO_USER:-orithos_ai_ro}
      AI_REPORT_RO_PASSWORD: ${AI_REPORT_RO_PASSWORD:-orithos-ai-ro}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  redis-data:
