# Use a distinct Compose project: docker compose -p orithos-uat --env-file .env.uat -f docker-compose.yml -f docker-compose.uat.yml up -d
services:
  backend:
    image: orithos-uat-backend:latest
    environment:
      RUNTIME_ENVIRONMENT: uat
      POSTGRESQL_URL: ${POSTGRESQL_URL:?Set a dedicated UAT PostgreSQL URL}
      AI_ENABLED: "true"
      AI_COMMANDS_ENABLED: "true"
      AI_COMMANDS_EXECUTION_ENABLED: "false"
      AI_REPLENISHMENT_COVERAGE_DAYS: "7"
      AI_REPLENISHMENT_SERVICE_FACTOR: "1.65"
      AI_REPLENISHMENT_CASE_PACK: "1"
      APP_NATIVE_POS_ONLY_MODE: "true"
  frontend:
    image: orithos-uat-frontend:latest
    labels:
      traefik.enable: "false"
    ports:
      - "127.0.0.1:3300:3000"
    environment:
      RUNTIME_ENVIRONMENT: uat
      # Enable the controlled Demo-only draft workflow in UAT. The API still
      # requires the explicit host allow-list and never confirms or sends POs.
      AI_PURCHASE_DRAFT_ENABLED: "true"
      AI_PURCHASE_DRAFT_ALLOWED_HOSTS: "demo.orithos.com.au"
