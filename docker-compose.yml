# Orithos POS — full stack: MySQL + Redis + Backend + Frontend
#
# Quick start (from repo root):
#   copy .env.example .env   # edit JWT_SECRET etc. for production
#   docker compose up -d --build
#
# Access:
#   Frontend  http://localhost:3000
#   Backend   http://localhost:8080
#   Login     admin / value of INITIAL_ADMIN_PASSWORD in .env
services:
  mysql:
    build:
      context: ./pos-api
      dockerfile: Dockerfile.mysql
    image: orithos-mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      MYSQL_DATABASE: ${DB_NAME:-orithos}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pos-api
      dockerfile: Dockerfile
    image: orithos-backend:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-orithos}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
      SQL_INIT_MODE: never
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in Dokploy}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@orithos.com.au}
      # AI assistant (DashScope). Defaults off; set AI_ENABLED=true + key in root .env
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL:-qwen-plus}
      AI_DASHSCOPE_BASE_URL: ${AI_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-qwen3-asr-flash}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
      AI_REPORT_RO_USER: ${AI_REPORT_RO_USER:-orithos_ai_ro}
      AI_REPORT_RO_PASSWORD: ${AI_REPORT_RO_PASSWORD:-}
      # Sommelier / AI catalogue SoT — same service account as frontend auto-recover.
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_DATABASE: ${ODOO_DATABASE:-aipos}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}
      R2_ARCHIVE_DATA_DIR: /var/lib/orithos/shopfront
      R2_SYNC_TIMEZONE: ${R2_SYNC_TIMEZONE:-Australia/Adelaide}
      R2_SYNC_HOUR: ${R2_SYNC_HOUR:-3}
      R2_SYNC_MINUTE: ${R2_SYNC_MINUTE:-30}
    volumes:
      - shopfront-archive:/var/lib/orithos/shopfront

  r2-sync:
    build:
      context: ./r2-sync
      dockerfile: Dockerfile
    image: orithos-r2-sync:latest
    restart: unless-stopped
    environment:
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-generate-image}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PREFIX: ${R2_PREFIX:-shopfront/}
      R2_DATABASE_KEY: ${R2_DATABASE_KEY:-shopfront/shopfront.sqlite3}
      R2_MANIFEST_KEY: ${R2_MANIFEST_KEY:-shopfront/manifest.json}
      R2_SYNC_TIMEZONE: ${R2_SYNC_TIMEZONE:-Australia/Adelaide}
      R2_SYNC_HOUR: ${R2_SYNC_HOUR:-3}
      R2_SYNC_MINUTE: ${R2_SYNC_MINUTE:-30}
      R2_RETAIN_SNAPSHOTS: ${R2_RETAIN_SNAPSHOTS:-2}
      R2_MAX_TOTAL_BYTES: ${R2_MAX_TOTAL_BYTES:-2147483648}
      R2_DATA_DIR: /data
    volumes:
      - shopfront-archive:/data

  frontend:
    build:
      context: ./pos-ui
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    image: orithos-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      # Used by the server-side Odoo session/data bridge. Keep credentials out
      # of the browser bundle. Staff may sign in with their own Odoo users, or
      # an optional least-privilege service account can restore sessions.
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_DATABASE: ${ODOO_DATABASE:-aipos}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}

volumes:
  mysql-data:
  redis-data:
  shopfront-archive:
