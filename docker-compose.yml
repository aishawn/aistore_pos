# Orithos POS — full stack: PostgreSQL + Backend + Frontend
#
# Quick start (from repo root):
#   copy .env.example .env   # edit JWT_SECRET etc. for production
#   docker compose up -d --build
#
# Access:
#   Frontend  http://localhost:3000
#   Backend   http://localhost:8080
#   Login     admin / value of INITIAL_ADMIN_PASSWORD in .env
services:
  backend:
    build:
      context: ./pos-api
      dockerfile: Dockerfile
      additional_contexts:
        git_metadata: .git
        build_metadata: ./build-metadata
    image: orithos-backend:latest
    restart: unless-stopped
    environment:
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-production}
      POSTGRESQL_URL: ${POSTGRESQL_URL:?Set POSTGRESQL_URL in Dokploy}
      CONTROL_POSTGRESQL_URL: ${CONTROL_POSTGRESQL_URL:-}
      SHARD_DATABASE_URLS: ${SHARD_DATABASE_URLS:-}
      APP_SHARDING_ENABLED: ${APP_SHARDING_ENABLED:-false}
      APP_DB_CONTROL_MAX_POOL_SIZE: ${APP_DB_CONTROL_MAX_POOL_SIZE:-10}
      APP_DB_SHARD_MAX_POOL_SIZE: ${APP_DB_SHARD_MAX_POOL_SIZE:-5}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      SPRING_DATA_REDIS_URL: ${POS_REDIS_URL:?Set POS_REDIS_URL in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
      SQL_INIT_MODE: never
      APP_NATIVE_POS_ONLY_MODE: ${APP_NATIVE_POS_ONLY_MODE:-true}
      APP_NATIVE_POS_ENABLED_VENDOR_IDS: ${APP_NATIVE_POS_ENABLED_VENDOR_IDS:-}
      APP_NATIVE_POS_EXPECTED_DATABASE: ${APP_NATIVE_POS_EXPECTED_DATABASE:-}
      APP_NATIVE_POS_ALLOW_SHARED_DATABASE: ${APP_NATIVE_POS_ALLOW_SHARED_DATABASE:-false}
      ISOLATION_POS_DATABASE: ${ISOLATION_POS_DATABASE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in Dokploy}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      APP_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
      APP_TENANT_RESERVED_SLUGS: ${APP_TENANT_RESERVED_SLUGS:-www,app,api,odoo,cdn,support,mail,status,shopfront,crawler}
      APP_TRIAL_DAYS: ${APP_TRIAL_DAYS:-14}
      APP_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
      APP_PLATFORM_OPERATOR_SLUG: ${APP_PLATFORM_OPERATOR_SLUG:-demo}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@orithos.com.au}
      # AI assistant. Defaults off; remote mode uses AI_SERVICE_TOKEN.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-remote}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-https://ai.orithos.com.au}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_FORECAST_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # AI command parsing/preview is safe to expose for manual testing; execution remains off by default.
      AI_COMMANDS_ENABLED: ${AI_COMMANDS_ENABLED:-true}
      AI_COMMANDS_EXECUTION_ENABLED: ${AI_COMMANDS_EXECUTION_ENABLED:-false}
      AI_GATEWAY_PRIMARY_MODEL: ${AI_GATEWAY_PRIMARY_MODEL:-qwen-plus}
      AI_GATEWAY_FALLBACK_MODEL: ${AI_GATEWAY_FALLBACK_MODEL:-qwen-flash}
      AI_GATEWAY_TRANSCRIPTION_MODEL: ${AI_GATEWAY_TRANSCRIPTION_MODEL:-qwen3-asr-flash}
      AI_GATEWAY_VISION_MODEL: ${AI_GATEWAY_VISION_MODEL:-qwen3.8-flash}
      AI_GATEWAY_FALLBACK_VISION_MODEL: ${AI_GATEWAY_FALLBACK_VISION_MODEL:-}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1024}
      # The model endpoint and provider credentials are owned by the remote AI service.
      AI_CONVERSATION_MEMORY_TURNS: ${AI_CONVERSATION_MEMORY_TURNS:-6}
      AI_CONVERSATION_MEMORY_TTL_MINUTES: ${AI_CONVERSATION_MEMORY_TTL_MINUTES:-120}
      # Scheduled AI snapshots now read the Orithos ledger and PostgreSQL facts.
      AI_REPLENISHMENT_COVERAGE_DAYS: ${AI_REPLENISHMENT_COVERAGE_DAYS:-7}
      AI_REPLENISHMENT_SERVICE_FACTOR: ${AI_REPLENISHMENT_SERVICE_FACTOR:-1.65}
      AI_REPLENISHMENT_CASE_PACK: ${AI_REPLENISHMENT_CASE_PACK:-1}
      AI_FORECAST_ENABLED: ${AI_FORECAST_ENABLED:-false}
      AI_FORECAST_BASE_URL: ${AI_FORECAST_BASE_URL:-https://ai.orithos.com.au}
      # Draft RFQs are a separate write gate from AI command execution.
      AI_PURCHASE_DRAFT_ENABLED: "true"
      AI_PURCHASE_DRAFT_ALLOWED_HOSTS: "demo.orithos.com.au,skr.orithos.com.au"
      AI_PURCHASE_CONFIRM_ENABLED: ${AI_PURCHASE_CONFIRM_ENABLED:-false}
      AI_FORECAST_READ_TIMEOUT_MS: ${AI_FORECAST_READ_TIMEOUT_MS:-190000}
      AI_FORECAST_MAX_HISTORY_DAYS: ${AI_FORECAST_MAX_HISTORY_DAYS:-365}
      AI_FORECAST_MAX_PRODUCTS: ${AI_FORECAST_MAX_PRODUCTS:-2000}
      AI_REPORT_RO_USER: ${AI_REPORT_RO_USER:-orithos_ai_ro}
      AI_REPORT_RO_PASSWORD: ${AI_REPORT_RO_PASSWORD:-}
      SHOPFRONT_INTEGRATION_ENABLED: ${SHOPFRONT_INTEGRATION_ENABLED:-false}
      SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}
      SHOPFRONT_BUSINESS_WRITE_ENABLED: ${SHOPFRONT_BUSINESS_WRITE_ENABLED:-true}
      APP_SHOPFRONT_INTEGRATION_ENABLED: ${SHOPFRONT_INTEGRATION_ENABLED:-false}
      APP_SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}

  frontend:
    build:
      context: ./pos-ui
      dockerfile: Dockerfile
      target: runner
      additional_contexts:
        git_metadata: .git
        build_metadata: ./build-metadata
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
        NEXT_PUBLIC_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
        ORITHOS_HC_BUNDLE_URL: ${ORITHOS_HC_BUNDLE_URL:-}
    image: orithos-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    # Dokploy Domains UI rejects "*.orithos.com.au". The wildcard router serves
    # tenant hosts; the explicit skr route overrides a stale Dokploy host rule.
    # In Compose, escape regex end-anchors as $$ so they survive interpolation.
    labels:
      - traefik.enable=true
      - traefik.http.routers.aistorepos-tenant-secure.rule=HostRegexp(`^[a-z0-9-]+\.orithos\.com\.au$$`) && !Host(`shopfront.orithos.com.au`) && !Host(`crawler.orithos.com.au`)
      - traefik.http.routers.aistorepos-tenant-secure.entrypoints=websecure
      - traefik.http.routers.aistorepos-tenant-secure.priority=1
      - traefik.http.routers.aistorepos-tenant-secure.tls=true
      - traefik.http.routers.aistorepos-tenant-secure.service=aistorepos-tenant-svc
      - traefik.http.routers.aistorepos-skr-secure.rule=Host(`skr.orithos.com.au`)
      - traefik.http.routers.aistorepos-skr-secure.entrypoints=websecure
      - traefik.http.routers.aistorepos-skr-secure.priority=1000
      - traefik.http.routers.aistorepos-skr-secure.tls=true
      - traefik.http.routers.aistorepos-skr-secure.service=aistorepos-tenant-svc
      - traefik.http.services.aistorepos-tenant-svc.loadbalancer.server.port=3000
      - traefik.http.services.aistorepos-tenant-svc.loadbalancer.passhostheader=true
    environment:
      RFQ_IDEMPOTENCY_DB: /var/lib/orithos/rfq/requests.sqlite
      POS_REDIS_URL: ${POS_REDIS_URL:?Set POS_REDIS_URL in Dokploy}
      NODE_ENV: production
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-production}
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}
      NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
      NEXT_PUBLIC_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
      # Controlled Demo-only draft RFQs are enabled by default; the route still
      # requires the explicit host allowlist (Demo + SKR after replenishment acceptance).
      AI_PURCHASE_DRAFT_ENABLED: "true"
      AI_PURCHASE_DRAFT_ALLOWED_HOSTS: "demo.orithos.com.au,skr.orithos.com.au"
      AI_FORECAST_ENABLED: ${AI_FORECAST_ENABLED:-false}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-https://ai.orithos.com.au}
      AI_FORECAST_BASE_URL: ${AI_FORECAST_BASE_URL:-https://ai.orithos.com.au}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_FORECAST_READ_TIMEOUT_MS: ${AI_FORECAST_READ_TIMEOUT_MS:-190000}
      ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET: ${ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET:-${SHOPFRONT_INTEGRATION_TOKEN:-}}
      ORITHOS_HC_DOWNLOAD_URL: ${ORITHOS_HC_DOWNLOAD_URL:-https://github.com/aishawn/aistore_pos/releases/download/hardware-connect-latest/OrithosHardwareConnect-Setup.exe}
      ORITHOS_HC_BUNDLE_URL: ${ORITHOS_HC_BUNDLE_URL:-}
      NEXT_PUBLIC_ORITHOS_HC_DOWNLOAD_URL: ${NEXT_PUBLIC_ORITHOS_HC_DOWNLOAD_URL:-}
    volumes:
      - rfq-requests:/var/lib/orithos/rfq

volumes:
  rfq-requests:
  # Keep legacy crawler data available for rollback; remove only after an explicit backup and cleanup plan.
  shopfront-crawler-data:
