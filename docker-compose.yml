# Orithos POS — full stack: PostgreSQL + Redis + Backend + Frontend
#
# Quick start (from repo root):
#   copy .env.example .env   # edit JWT_SECRET etc. for production
#   docker compose up -d --build
#
# Access:
#   Frontend  http://localhost:3000
#   Backend   http://localhost:8080
#   Login     admin / value of INITIAL_ADMIN_PASSWORD in .env
services:
  inventory-snapshots:
    build:
      context: .
      dockerfile: inventory-snapshots/Dockerfile
    restart: unless-stopped
    environment:
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_DATABASE: ${ODOO_DATABASE:?Set ODOO_DATABASE in Dokploy}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}
      INVENTORY_SNAPSHOT_TARGETS: ${INVENTORY_SNAPSHOT_TARGETS:-[]}
      INVENTORY_SNAPSHOT_ROOT: /data
    volumes:
      - inventory-snapshots:/data

  report-worker:
    build:
      context: .
      dockerfile: report-worker/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_DATABASE: ${ODOO_DATABASE:?Set ODOO_DATABASE in Dokploy}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}
      REPORT_SNAPSHOT_TARGETS: ${REPORT_SNAPSHOT_TARGETS:-[]}
      REPORT_REDIS_HOST: redis
      REPORT_REDIS_DB: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}

  forecast-service:
    build:
      context: ./forecast-service
      dockerfile: Dockerfile
    image: orithos-forecast-service:latest
    restart: unless-stopped
    expose:
      - "8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy} --appendonly yes --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./pos-api
      dockerfile: Dockerfile
      additional_contexts:
        git_metadata: .git
        build_metadata: ./build-metadata
    image: orithos-backend:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      forecast-service:
        condition: service_started
    environment:
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-production}
      POSTGRESQL_URL: ${POSTGRESQL_URL:?Set POSTGRESQL_URL in Dokploy}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
      SQL_INIT_MODE: never
      APP_ODOO_ONLY_MODE: ${APP_ODOO_ONLY_MODE:-${ODOO_ONLY_MODE:-true}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in Dokploy}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      APP_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
      APP_TENANT_RESERVED_SLUGS: ${APP_TENANT_RESERVED_SLUGS:-www,app,api,odoo,cdn,support,mail,status}
      APP_TRIAL_DAYS: ${APP_TRIAL_DAYS:-14}
      APP_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
      APP_PLATFORM_OPERATOR_SLUG: ${APP_PLATFORM_OPERATOR_SLUG:-demo}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@orithos.com.au}
      # AI assistant (DashScope). Defaults off; set AI_ENABLED=true + key in root .env
      AI_ENABLED: ${AI_ENABLED:-false}
      # AI command parsing/preview is safe to expose for manual testing; execution remains off by default.
      AI_COMMANDS_ENABLED: ${AI_COMMANDS_ENABLED:-true}
      AI_COMMANDS_EXECUTION_ENABLED: ${AI_COMMANDS_EXECUTION_ENABLED:-false}
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY:-}
      AI_DASHSCOPE_MODEL: ${AI_DASHSCOPE_MODEL:-qwen-plus}
      AI_DASHSCOPE_CLASSIFY_MODEL: ${AI_DASHSCOPE_CLASSIFY_MODEL:-qwen-flash}
      AI_DASHSCOPE_TEMPERATURE: ${AI_DASHSCOPE_TEMPERATURE:-0.1}
      AI_DASHSCOPE_MAX_TOKENS: ${AI_DASHSCOPE_MAX_TOKENS:-1024}
      AI_DASHSCOPE_TIMEOUT_SECONDS: ${AI_DASHSCOPE_TIMEOUT_SECONDS:-40}
      # Host only (no /api/v1). qwen3.8-flash sets multi-model=true; text remains the fallback path.
      AI_DASHSCOPE_BASE_URL: ${AI_DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      AI_DASHSCOPE_MULTI_MODEL: ${AI_DASHSCOPE_MULTI_MODEL:-}
      AI_DASHSCOPE_COMPLETIONS_PATH: ${AI_DASHSCOPE_COMPLETIONS_PATH:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-qwen3-asr-flash}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-qwen-vl-plus}
      AI_CONVERSATION_MEMORY_TURNS: ${AI_CONVERSATION_MEMORY_TURNS:-6}
      AI_CONVERSATION_MEMORY_TTL_MINUTES: ${AI_CONVERSATION_MEMORY_TTL_MINUTES:-120}
      # Keep the read-only Odoo snapshot pipeline explicit and reproducible.
      # The scheduled job never writes Odoo; it only refreshes PostgreSQL facts.
      APP_AI_SNAPSHOT_SYNC_ENABLED: ${APP_AI_SNAPSHOT_SYNC_ENABLED:-true}
      APP_AI_SNAPSHOT_SYNC_DELAY_MS: ${APP_AI_SNAPSHOT_SYNC_DELAY_MS:-21600000}
      APP_AI_SNAPSHOT_SYNC_INITIAL_DELAY_MS: ${APP_AI_SNAPSHOT_SYNC_INITIAL_DELAY_MS:-60000}
      AI_REPLENISHMENT_COVERAGE_DAYS: ${AI_REPLENISHMENT_COVERAGE_DAYS:-7}
      AI_REPLENISHMENT_SERVICE_FACTOR: ${AI_REPLENISHMENT_SERVICE_FACTOR:-1.65}
      AI_REPLENISHMENT_CASE_PACK: ${AI_REPLENISHMENT_CASE_PACK:-1}
      AI_FORECAST_ENABLED: ${AI_FORECAST_ENABLED:-false}
      AI_FORECAST_BASE_URL: ${AI_FORECAST_BASE_URL:-http://forecast-service:8000}
      # Draft RFQs are a separate write gate from AI command execution.
      # Controlled Demo-only draft RFQs are enabled by default; the route still
      # requires the explicit host allowlist, so SKR remains read-only.
      AI_PURCHASE_DRAFT_ENABLED: "true"
      AI_PURCHASE_CONFIRM_ENABLED: ${AI_PURCHASE_CONFIRM_ENABLED:-false}
      AI_FORECAST_READ_TIMEOUT_MS: ${AI_FORECAST_READ_TIMEOUT_MS:-10000}
      AI_FORECAST_MAX_HISTORY_DAYS: ${AI_FORECAST_MAX_HISTORY_DAYS:-365}
      AI_FORECAST_MAX_PRODUCTS: ${AI_FORECAST_MAX_PRODUCTS:-2000}
      AI_REPORT_RO_USER: ${AI_REPORT_RO_USER:-orithos_ai_ro}
      AI_REPORT_RO_PASSWORD: ${AI_REPORT_RO_PASSWORD:-}
      # Sommelier / AI catalogue SoT — same service account as frontend auto-recover.
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      # Never silently point a production deployment at the shared UAT database.
      # Dokploy must provide the database names explicitly for each environment.
      ODOO_DATABASE: ${ODOO_DATABASE:?Set ODOO_DATABASE in Dokploy}
      ODOO_DATABASE_UAT: ${ODOO_DATABASE_UAT:-aipos_uat}
      ISOLATION_ODOO_DATABASE: ${ISOLATION_ODOO_DATABASE:?Set ISOLATION_ODOO_DATABASE in Dokploy}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}
      SHOPFRONT_INTEGRATION_ENABLED: ${SHOPFRONT_INTEGRATION_ENABLED:-false}
      SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}
      SHOPFRONT_BUSINESS_WRITE_ENABLED: ${SHOPFRONT_BUSINESS_WRITE_ENABLED:-true}
      APP_SHOPFRONT_INTEGRATION_ENABLED: ${SHOPFRONT_INTEGRATION_ENABLED:-false}
      APP_SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}

  # Independent Shopfront synchronization worker. Its database and OAuth
  # credentials are isolated from the POS application and persist across
  # redeployments.
  shopfront-crawler:
    build:
      context: ./shopfront_crawler
      dockerfile: Dockerfile
    image: orithos-shopfront-crawler:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    expose:
      - "8000"
    environment:
      SHOPFRONT_CLIENT_ID: ${SHOPFRONT_CLIENT_ID:-}
      SHOPFRONT_CLIENT_SECRET: ${SHOPFRONT_CLIENT_SECRET:-}
      SHOPFRONT_REDIRECT_URI: ${SHOPFRONT_REDIRECT_URI:-https://shopfront.orithos.com.au/oauth/shopfront/callback}
      SHOPFRONT_SCOPES: ${SHOPFRONT_SCOPES:-run_sales_reports see_products see_history}
      SHOPFRONT_ENABLE_ADVANCED_REPORTS: ${SHOPFRONT_ENABLE_ADVANCED_REPORTS:-false}
      SHOPFRONT_ENABLE_SUPPLY_CHAIN: ${SHOPFRONT_ENABLE_SUPPLY_CHAIN:-false}
      SHOPFRONT_ENABLE_CUSTOMERS: ${SHOPFRONT_ENABLE_CUSTOMERS:-false}
      SHOPFRONT_STORES: ${SHOPFRONT_STORES:-skr:skr}
      DATABASE_URL: ${SHOPFRONT_DATABASE_URL:-sqlite:////data/shopfront_crawler.db}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SYNC_TIMEZONE: ${SYNC_TIMEZONE:-Australia/Adelaide}
      SYNC_DAILY_HOURS: ${SYNC_DAILY_HOURS:-6,23}
      SYNC_DAILY_MINUTE: ${SYNC_DAILY_MINUTE:-0}
      SYNC_FULL_INVENTORY_HOURS: ${SYNC_FULL_INVENTORY_HOURS:-6}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-2}
      HISTORY_CHUNK_DAYS: ${HISTORY_CHUNK_DAYS:-14}
      SHOPFRONT_HISTORY_START_YEAR: ${SHOPFRONT_HISTORY_START_YEAR:-2010}
      POS_API_BASE_URL: ${SHOPFRONT_POS_API_BASE_URL:-http://backend:8080}
      POS_API_TOKEN: ${SHOPFRONT_POS_API_TOKEN:-}
      SHOPFRONT_INTEGRATION_TOKEN: ${SHOPFRONT_INTEGRATION_TOKEN:-}
      POS_IMPORT_ENABLED: ${SHOPFRONT_POS_IMPORT_ENABLED:-true}
      # Keep the crawler's formal-write flag explicit. Older deployments only
      # exposed ODOO_BUSINESS_WRITE_ENABLED, while the crawler reads the
      # POS_BUSINESS_WRITE_ENABLED setting directly.
      POS_BUSINESS_WRITE_ENABLED: ${POS_BUSINESS_WRITE_ENABLED:-${ODOO_BUSINESS_WRITE_ENABLED:-false}}
      ODOO_API_BASE_URL: ${ODOO_API_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_API_TOKEN: ${ODOO_API_TOKEN:-}
      ODOO_API_DATABASE: ${ODOO_API_DATABASE:-aipos_uat}
      ODOO_IMPORT_ENABLED: ${ODOO_IMPORT_ENABLED:-true}
      ODOO_BUSINESS_WRITE_ENABLED: ${ODOO_BUSINESS_WRITE_ENABLED:-false}
      POS_UI_NOTIFY_URL: ${POS_UI_NOTIFY_URL:-http://frontend:3000/api/internal/shopfront-sync-notify}
      ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET: ${ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET:-${SHOPFRONT_INTEGRATION_TOKEN:-}}
      REPORT_SYNC_NOTIFICATION_URL: ${REPORT_SYNC_NOTIFICATION_URL:-http://frontend:3000/api/internal/shopfront-sync-complete}
      SHOPFRONT_WEBHOOK_SIGNING_KEY_SKR: ${SHOPFRONT_WEBHOOK_SIGNING_KEY_SKR:-}
    volumes:
      - shopfront-crawler-data:/data
    labels:
      - traefik.enable=true
      # Keep an explicit router for the crawler host. The frontend wildcard
      # router intentionally excludes this host, so the crawler must own both
      # entrypoints independently of Dokploy's generated domain labels.
      - traefik.http.routers.shopfront-crawler.rule=Host(`shopfront.orithos.com.au`)
      - traefik.http.routers.shopfront-crawler.entrypoints=web
      - traefik.http.routers.shopfront-crawler.service=shopfront-crawler-svc
      - traefik.http.routers.shopfront-crawler-secure.rule=Host(`shopfront.orithos.com.au`)
      - traefik.http.routers.shopfront-crawler-secure.entrypoints=websecure
      - traefik.http.routers.shopfront-crawler-secure.priority=100
      - traefik.http.routers.shopfront-crawler-secure.tls=true
      - traefik.http.routers.shopfront-crawler-secure.tls.certresolver=letsencrypt
      - traefik.http.services.shopfront-crawler-svc.loadbalancer.server.port=8000

  frontend:
    build:
      context: ./pos-ui
      dockerfile: Dockerfile
      target: runner
      additional_contexts:
        git_metadata: .git
        build_metadata: ./build-metadata
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
        NEXT_PUBLIC_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    image: orithos-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"
    # Dokploy Domains UI rejects "*.orithos.com.au". The wildcard router serves
    # tenant hosts; the explicit skr route overrides a stale Dokploy host rule.
    # In Compose, escape regex end-anchors as $$ so they survive interpolation.
    labels:
      - traefik.enable=true
      - traefik.http.routers.aistorepos-tenant-secure.rule=HostRegexp(`^[a-z0-9-]+\.orithos\.com\.au$$`) && !Host(`shopfront.orithos.com.au`)
      - traefik.http.routers.aistorepos-tenant-secure.entrypoints=websecure
      - traefik.http.routers.aistorepos-tenant-secure.priority=1
      - traefik.http.routers.aistorepos-tenant-secure.tls=true
      - traefik.http.routers.aistorepos-tenant-secure.service=aistorepos-tenant-svc
      - traefik.http.routers.aistorepos-skr-secure.rule=Host(`skr.orithos.com.au`)
      - traefik.http.routers.aistorepos-skr-secure.entrypoints=websecure
      - traefik.http.routers.aistorepos-skr-secure.priority=1000
      - traefik.http.routers.aistorepos-skr-secure.tls=true
      - traefik.http.routers.aistorepos-skr-secure.service=aistorepos-tenant-svc
      - traefik.http.services.aistorepos-tenant-svc.loadbalancer.server.port=3000
      - traefik.http.services.aistorepos-tenant-svc.loadbalancer.passhostheader=true
    environment:
      REPORT_SNAPSHOT_TARGETS: ${REPORT_SNAPSHOT_TARGETS:-[]}
      REPORT_REDIS_HOST: redis
      REPORT_REDIS_DB: "1"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Dokploy}
      RFQ_IDEMPOTENCY_DB: /var/lib/orithos/rfq/requests.sqlite
      INVENTORY_SNAPSHOT_ROOT: /var/lib/orithos/inventory-snapshots
      NODE_ENV: production
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-production}
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      SHOPFRONT_CRAWLER_URL: ${SHOPFRONT_CRAWLER_URL:-http://shopfront-crawler:8000}
      NEXT_PUBLIC_TENANT_BASE_DOMAIN: ${APP_TENANT_BASE_DOMAIN:-orithos.com.au}
      NEXT_PUBLIC_TENANT_SCHEME: ${APP_TENANT_SCHEME:-https}
      ODOO_STOCKTAKE_WRITE_ENABLED: ${ODOO_STOCKTAKE_WRITE_ENABLED:-false}
      # Controlled Demo-only draft RFQs are enabled by default; the route still
      # requires the explicit host allowlist, so SKR remains read-only.
      AI_PURCHASE_DRAFT_ENABLED: "true"
      AI_PURCHASE_DRAFT_ALLOWED_HOSTS: "demo.orithos.com.au"
      AI_FORECAST_ENABLED: ${AI_FORECAST_ENABLED:-false}
      AI_FORECAST_BASE_URL: ${AI_FORECAST_BASE_URL:-http://forecast-service:8000}
      AI_FORECAST_READ_TIMEOUT_MS: ${AI_FORECAST_READ_TIMEOUT_MS:-10000}
      # Used by the server-side Odoo session/data bridge. Keep credentials out
      # of the browser bundle. Staff may sign in with their own Odoo users, or
      # an optional least-privilege service account can restore sessions.
      ODOO_BASE_URL: ${ODOO_BASE_URL:-https://odoo.orithos.com.au}
      ODOO_DATABASE: ${ODOO_DATABASE:?Set ODOO_DATABASE in Dokploy}
      ODOO_DATABASE_UAT: ${ODOO_DATABASE_UAT:-aipos_uat}
      ODOO_CATEGORY_WRITE_ENABLED: ${ODOO_CATEGORY_WRITE_ENABLED:-false}
      ODOO_CLOSE_MAX_ORDERS: ${ODOO_CLOSE_MAX_ORDERS:-10000}
      ISOLATION_ODOO_DATABASE: ${ISOLATION_ODOO_DATABASE:?Set ISOLATION_ODOO_DATABASE in Dokploy}
      ODOO_SERVICE_USERNAME: ${ODOO_SERVICE_USERNAME:-}
      ODOO_SERVICE_PASSWORD: ${ODOO_SERVICE_PASSWORD:-}
      ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET: ${ORITHOS_SHOPFRONT_SYNC_NOTIFY_SECRET:-${SHOPFRONT_INTEGRATION_TOKEN:-}}
    volumes:
      - rfq-requests:/var/lib/orithos/rfq
      - inventory-snapshots:/var/lib/orithos/inventory-snapshots:ro

volumes:
  inventory-snapshots:
  rfq-requests:
  redis-data:
  shopfront-crawler-data:
