openapi: 3.1.0
info:
  title: Orithos POS API
  version: 1.0.0
  description: >-
    Odoo-backed, tenant-scoped API. Read operations are available. Batch writes
    for sales (including full-sale refunds), stock counts, and draft purchase
    orders are feature-gated and disabled by default. Purchase receipt validation
    remains in the store workflow and is not exposed as a batch resource.
servers:
  - url: https://{storeHost}/api/pos/v1
    variables:
      storeHost:
        default: demo.orithos.com.au
security:
  - bearerAuth: []
paths:
  /auth/tokens:
    post:
      summary: Create a scoped API token using the browser administrator JWT
      security:
        - browserJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, maxLength: 120 }
                scopes:
                  type: array
                  items: { type: string, enum: [api.read, api.write, api.batch, api.webhook, api.admin] }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Token returned once with identifier and granted scopes }
        '403': { description: Vendor administrator required }
  /auth/tokens/{id}:
    delete:
      summary: Revoke an API token using the browser administrator JWT
      security:
        - browserJwt: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Token revoked }
  /{resource}:
    get:
      summary: List a supported resource
      parameters:
        - in: path
          name: resource
          required: true
          schema:
            type: string
            enum: [products, inventory, customers, suppliers, sales, orders, purchases]
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200': { description: Tenant-scoped Odoo records }
        '401': { description: Missing, expired, or revoked API token }
        '403': { description: Missing scope or tenant mismatch }
        '502': { description: Odoo read failed }
  /{resource}/{id}:
    get:
      summary: Get a supported Odoo record
      parameters:
        - in: path
          name: resource
          required: true
          schema: { type: string, enum: [products, inventory, customers, suppliers, sales, orders, purchases] }
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Tenant-scoped Odoo record }
        '404': { description: Record not found }
  /sales:quote:
    post:
      summary: Request an Odoo-backed sale quote
      responses:
        '200': { description: Quote response }
        '400': { description: Invalid quote request }
        '502': { description: Odoo quote failed }
  /{resource}:batch:
    post:
      summary: Submit a feature-gated batch operation
      description: Sales (including full-sale refunds), inventory counts, and draft purchase orders only. Server flags default to false. Purchase receipts are not supported.
      parameters:
        - in: path
          name: resource
          required: true
          schema: { type: string, enum: [sales, inventory, purchases] }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: object }
                - type: object
                  required: [records]
                  properties:
                    records:
                      type: array
                      minItems: 1
                      maxItems: 500
                      items: { type: object }
      responses:
        '202': { description: Operation accepted; poll the returned operationId }
        '401': { description: Missing, expired, or revoked API token }
        '403': { description: Missing scope or tenant mismatch }
        '409': { description: Idempotency key reused with a different request }
        '423': { description: Write feature disabled }
        '501': { description: Resource write not implemented }
  /operations/{id}:
    get:
      summary: Read an asynchronous operation status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Operation status and item results }
        '404': { description: Operation not found in this vendor }
  /webhooks:
    get:
      summary: List webhook subscriptions
      responses:
        '200': { description: Active and revoked subscriptions for the vendor }
    post:
      summary: Register a webhook endpoint
      description: Requires POS_API_WEBHOOK_ENCRYPTION_KEY and api.webhook scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
                    enum: [operation.completed, operation.failed, sale.created, refund.created, inventory.adjusted, purchase.created]
      responses:
        '200': { description: Subscription created; signing secret returned once }
        '400': { description: Invalid or non-public HTTPS endpoint }
        '503': { description: Webhook encryption is not configured }
  /webhooks/{id}:
    delete:
      summary: Revoke a webhook subscription
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { description: Subscription revoked }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    browserJwt:
      type: http
      scheme: bearer
