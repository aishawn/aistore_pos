name: Project fact library

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "scripts/check-project-docs.py"
      - "scripts/tests/test_project_docs.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/project-docs-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "scripts/check-project-docs.py"
      - "scripts/tests/test_project_docs.py"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/project-docs-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check-project-docs.py
      - run: python -m unittest discover -s scripts/tests -p test_project_docs.py
