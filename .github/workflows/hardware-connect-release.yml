name: Hardware Connect Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/orithos-hardware-connect/**"
      - ".github/workflows/hardware-connect-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build register bundle
        shell: pwsh
        run: |
          Set-Location tools/orithos-hardware-connect
          ./bundle-register.ps1

      - name: Stage stable release asset names
        shell: pwsh
        run: |
          Set-Location tools/orithos-hardware-connect
          $version = (Select-Xml -Path ./OrithosHardwareConnect.csproj -XPath "/Project/PropertyGroup/Version").Node.InnerText.Trim()
          $releaseDir = Join-Path (Get-Location) "dist/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $setup = Join-Path (Get-Location) "dist/OrithosHardwareConnect-$version-win-x64-Setup.exe"
          $zip = Join-Path (Get-Location) "dist/OrithosHardwareConnect-$version-win-x64.zip"
          if (-not (Test-Path $setup)) { throw "Missing setup: $setup" }
          if (-not (Test-Path $zip)) { throw "Missing zip: $zip" }
          Copy-Item $setup (Join-Path $releaseDir "OrithosHardwareConnect-Setup.exe") -Force
          Copy-Item $zip (Join-Path $releaseDir "OrithosHardwareConnect-win-x64.zip") -Force
          "HC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Optional Authenticode sign
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERT_PFX_BASE64) {
            Write-Host "No signing secret; publishing unsigned bundle."
            exit 0
          }
          Set-Location tools/orithos-hardware-connect
          ./sign-install.ps1 -ZipPath ./dist/release/OrithosHardwareConnect-win-x64.zip

      - name: Publish rolling release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hardware-connect-latest
          name: Orithos Hardware Connect (latest Windows x64)
          body: |
            Self-contained Orithos register agent for Windows: receipt printers (9170) and EFTPOS bridge (9167) in one install.
            Download OrithosHardwareConnect-Setup.exe (version in install.json on your store).
          files: |
            tools/orithos-hardware-connect/dist/release/OrithosHardwareConnect-Setup.exe
            tools/orithos-hardware-connect/dist/release/OrithosHardwareConnect-win-x64.zip
          make_latest: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true