name: Hardware Connect Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/orithos-hardware-connect/**"
      - "tools/orithos-hardware-connect.Tests/**"
      - ".github/workflows/hardware-connect-release.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run Hardware Connect security tests
        run: dotnet test tools/orithos-hardware-connect.Tests/Orithos.HardwareConnect.Tests.csproj --configuration Release --verbosity minimal

      - name: Run release signing script tests
        shell: pwsh
        run: Invoke-Pester -Script tools/orithos-hardware-connect.Tests/SignRelease.Tests.ps1 -EnableExit

      - name: Build register bundle
        shell: pwsh
        run: |
          Set-Location tools/orithos-hardware-connect
          ./bundle-register.ps1

      - name: Stage stable release asset names
        shell: pwsh
        run: |
          Set-Location tools/orithos-hardware-connect
          $version = (Select-Xml -Path ./OrithosHardwareConnect.csproj -XPath "/Project/PropertyGroup/Version").Node.InnerText.Trim()
          $releaseDir = Join-Path (Get-Location) "dist/release"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $setup = Join-Path (Get-Location) "dist/OrithosHardwareConnect-$version-win-x64-Setup.exe"
          $zip = Join-Path (Get-Location) "dist/OrithosHardwareConnect-$version-win-x64.zip"
          if (-not (Test-Path $setup)) { throw "Missing setup: $setup" }
          if (-not (Test-Path $zip)) { throw "Missing zip: $zip" }
          Copy-Item $setup (Join-Path $releaseDir "OrithosHardwareConnect-Setup.exe") -Force
          Copy-Item $zip (Join-Path $releaseDir "OrithosHardwareConnect-win-x64.zip") -Force
          "HC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticode sign and verify all release executables
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_PFX_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERT_PFX_BASE64) {
            throw "Cannot publish Hardware Connect unsigned. Configure WINDOWS_SIGNING_CERT_PFX_BASE64 and set WINDOWS_SIGNING_CERT_PASSWORD when the certificate uses a password."
          }
          Set-Location tools/orithos-hardware-connect
          ./sign-release.ps1 `
            -ExePath ./dist/release/OrithosHardwareConnect-Setup.exe `
            -ZipPath ./dist/release/OrithosHardwareConnect-win-x64.zip `
            -RequireSignature

      - name: Upload signed release assets
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hardware-connect-release
          path: |
            tools/orithos-hardware-connect/dist/release/OrithosHardwareConnect-Setup.exe
            tools/orithos-hardware-connect/dist/release/OrithosHardwareConnect-win-x64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hardware-connect-release
          path: release

      - name: Publish rolling release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: hardware-connect-latest
          name: Orithos Hardware Connect (latest Windows x64)
          body: |
            Self-contained Orithos register agent for Windows: receipt printers (9170) and EFTPOS bridge (9167) in one install.
            Download OrithosHardwareConnect-Setup.exe (version in install.json on your store).
          files: |
            release/OrithosHardwareConnect-Setup.exe
            release/OrithosHardwareConnect-win-x64.zip
          make_latest: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
